<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Smart Plant Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }

        .card {
            background: #1e1e1e;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 5px solid #4CAF50;
        }
    </style>
</head>

<body>
    <h2>🌱 Pemantauan Tanaman</h2>
    <div id="sensor-list">Memuat data dari server...</div>

    <script>
        async function ambilData() {
            try {
                const respons = await fetch('https://smart-plant-api.vercel.app/sensor-data');
                const data = await respons.json();

                let htmlData = '';
                data.forEach(sensor => {
                    htmlData += `
                    <div class="card">
                        <p><strong>Suhu:</strong> ${sensor.temperature}°C | <strong>Udara:</strong> ${sensor.air_humidity}% | <strong>Tanah:</strong> ${sensor.soil_humidity}%</p>
                        <small>Waktu: ${new Date(sensor.recorded_at).toLocaleString('id-ID')}</small>
                    </div>`;
                });

                document.getElementById('sensor-list').innerHTML = htmlData;
            } catch (error) {
                document.getElementById('sensor-list').innerHTML = "Gagal mengambil data.";
            }
        }
        ambilData();
    </script>
</body>

</html>
